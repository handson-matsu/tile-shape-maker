<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>タイル輪郭メーカー</title><meta name="description" content="切って、うつして、ひっくり返して。自分だけのタイルの輪郭をつくろう。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230b887c' d='M3 3h11l3 6 3-6h9v26H3V18l6-3-6-3z'/%3E%3C/svg%3E"><link rel="stylesheet" href="./tile-app/dist/style.css"></head><body>
<header><div class="brand"><span class="logo">◩</span><div><h1>タイル輪郭メーカー</h1><p>切って、うつして、かたちをつくろう。</p></div></div><span class="edition">かたちの実験室</span></header>
<main><aside class="controls"><section><h2><b>1</b> 基本図形を選ぶ</h2><div id="shapes" class="choices shapes"></div></section><section><h2><b>2</b> 加工する辺を選ぶ</h2><p class="hint">図形の辺、または下の番号をタップ</p><div id="edges" class="choices edges"></div></section><section><h2><b>3</b> 切り取り方を選ぶ</h2><label>使う範囲</label><div id="ranges" class="choices"></div><label>かたちのバランス</label><div id="symmetries" class="choices"></div><div id="biasControl" hidden><div id="biases" class="choices" role="group" aria-label="非対称の向き" style="margin-top:7px"></div></div><label>切り取りパターン</label><div id="patterns" class="choices patterns"></div><label>高さ</label><div id="heights" class="choices" role="group" aria-label="切り取りパターンの高さ"></div></section><section><h2><b>4</b> 反転するか選ぶ</h2><div id="methods" class="methods"></div><p id="methodHint" class="hint"></p></section></aside>
<div class="workspace"><div class="canvasbar"><div><span class="eyebrow">WORKSPACE</span><h2 id="canvasTitle">辺を選んではじめよう</h2></div><span id="count" class="badge">0 回加工</span></div><div id="canvas" class="canvas"><svg id="drawing" viewBox="-260 -235 520 470" aria-label="タイルの作業エリア"></svg><div class="legend"><span><i class="cutkey"></i>切り取る部分</span><span><i class="destkey"></i>配置候補</span></div></div><div class="stage"><div class="stage-number" id="stageNumber">2</div><div><strong id="stageTitle">加工する辺を選ぼう</strong><p id="status" role="status" aria-live="polite">青緑色の辺をタップしてください。</p></div></div><div id="destinations" class="destinations"></div><div class="toolbar"><div><button id="undo">↶ 1つ戻る</button><button id="redo">↷ やり直す</button></div><button id="reset" class="reset">すべてリセット</button></div><div class="export"><div><h2><b>6</b> 完成形を確認・保存</h2><div class="tile-color-control"><span>タイルの色</span><div id="tileColors" class="tile-colors" role="group" aria-label="タイルの色"></div></div><div class="background-control"><span>背景</span><button id="white"><i class="swatch white"></i>白</button><button id="black"><i class="swatch black"></i>黒</button></div></div><div class="export-actions"><button id="preview">完成形を見る</button><button id="download" class="primary">↓ PNGで保存</button></div></div><p class="footnote">敷き詰められるかどうかは判定しません。自由に試してみよう。</p></div></main>
<dialog id="confirm"><h2>すべてリセットしますか？</h2><p>加工前の図形に戻します。あとから「1つ戻る」で戻せます。</p><div><button id="cancelReset">キャンセル</button><button id="doReset" class="primary">リセットする</button></div></dialog><script type="module" src="./tile-app/dist/app.mjs"></script></body></html>
